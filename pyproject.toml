[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-emaki"
version = "0.1.0"
description = "LangChain tools for emaki (emaki.ai), the Japanese-language AI video generator for Seedance 2.5 and Seedance 2.0: text to video, image to video and AI images from an agent"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "emaki" }]
keywords = ["langchain", "ai", "video-generation", "text-to-video", "image-to-video", "seedance", "seedance-2-5", "tool", "agent", "emaki"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Natural Language :: Japanese",
  "Topic :: Multimedia :: Video",
  "Topic :: Multimedia :: Graphics",
]
dependencies = ["langchain-core>=0.3", "emaki>=0.1.0"]

[project.urls]
Homepage = "https://emaki.ai/?utm_source=pypi-langchain&utm_medium=package"
"Seedance 2.5" = "https://emaki.ai/seedance-2-5"
Documentation = "https://emaki.readthedocs.io/en/latest/integrations/langchain/"
Source = "https://github.com/hanshs474/langchain-emaki"

[tool.hatch.build.targets.wheel]
packages = ["langchain_emaki"]
